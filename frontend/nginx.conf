server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/usuarios {
        proxy_pass http://usuarios-service:3001;
    }

    location /api/ {
        proxy_pass http://backend-container:3000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
